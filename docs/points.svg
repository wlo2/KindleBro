<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" role="img" aria-label="Free, Offline, Open source, Open format">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 38px; fill: #1f2328; }
    line { stroke: #d1d9e0; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      line { stroke: #3d444d; }
    }
  </style>
  <line x1="300" y1="30" x2="300" y2="90"/>
  <line x1="600" y1="30" x2="600" y2="90"/>
  <line x1="900" y1="30" x2="900" y2="90"/>
  <text x="150" y="73" text-anchor="middle">Free</text>
  <text x="450" y="73" text-anchor="middle">Offline</text>
  <text x="750" y="73" text-anchor="middle">Open source</text>
  <text x="1050" y="73" text-anchor="middle">Open format</text>
</svg>
